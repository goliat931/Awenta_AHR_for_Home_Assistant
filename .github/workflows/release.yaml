name: Auto Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in manifest.json
        id: bump_version
        run: |
          # Read current version
          VERSION=$(jq -r '.version' custom_components/awenta_ahr/manifest.json)

          # Split version into major, minor, patch
          IFS='.' read -ra ADDR <<< "$VERSION"
          MAJOR="${ADDR[0]}"
          MINOR="${ADDR[1]}"
          PATCH="${ADDR[2]}"

          # Increment patch
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

          # Update manifest.json
          jq --arg v "$NEW_VERSION" '.version = $v' custom_components/awenta_ahr/manifest.json > tmp.json && mv tmp.json custom_components/awenta_ahr/manifest.json

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/awenta_ahr/manifest.json
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_version }}"
          git push
          # Tag i release muszą wskazywać na TEN commit (z podbitą wersją),
          # a nie na GITHUB_SHA sprzed bumpu - inaczej wydanie oznaczone jako
          # np. v1.0.3 zawierałoby manifest.json z wersją 1.0.2.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create ZIP archive
        run: |
          cd custom_components/awenta_ahr
          zip -r ../../awenta_ahr.zip .
          cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Release v${{ steps.bump_version.outputs.new_version }}
          files: awenta_ahr.zip
          generate_release_notes: true
